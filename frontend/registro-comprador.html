<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de comprador · ADD-COM</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="wrap">
    <div id="site-header"></div>
    <main class="page form-card">
      <p class="eyebrow">Compradores</p>
      <h1>Crea tu cuenta para chatear</h1>
      <form id="form" class="card" novalidate>
        <label>
          <span class="lbl">Nombre completo</span>
          <input name="nombres" required minlength="3" maxlength="150">
        </label>
        <label>
          <span class="lbl">Correo</span>
          <input name="email" type="email" required>
        </label>
        <label>
          <span class="lbl">Teléfono (opcional)</span>
          <input name="telefono" maxlength="20">
        </label>
        <label>
          <span class="lbl">Contraseña</span>
          <input name="password" type="password" required minlength="8" placeholder="Mínimo 8 caracteres, letras y números">
        </label>
        <button class="btn btn-gold btn-block" type="submit">Crear cuenta</button>
      </form>
    </main>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    ui.renderHeader();
    const next = new URLSearchParams(location.search).get('next') || '/catalogo.html';
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        const data = await api.post('/api/auth/registro-comprador', {
          nombres: form.nombres.value,
          email: form.email.value,
          telefono: form.telefono.value,
          password: form.password.value,
        });
        auth.setSession(data.token, data.usuario);
        location.href = next.startsWith('/') ? next : '/catalogo.html';
      } catch (err) {
        ui.showFieldErrors(form, err.fields);
        ui.toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
