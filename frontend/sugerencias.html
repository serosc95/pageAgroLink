<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sugerencias · ADD-COM</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="wrap">
    <div id="site-header"></div>
    <main class="page form-card">
      <p class="eyebrow">Institucional</p>
      <h1>Buzón de sugerencias</h1>
      <p class="lead">Cuéntanos qué falta, qué sobra o cómo mejorar el trato entre campo y cocina.</p>
      <form id="form" class="card" novalidate>
        <label>
          <span class="lbl">Nombre (opcional)</span>
          <input name="nombre" maxlength="150">
        </label>
        <label>
          <span class="lbl">Correo (opcional)</span>
          <input name="email" type="email" maxlength="150">
        </label>
        <label>
          <span class="lbl">Sugerencia</span>
          <textarea name="mensaje" required minlength="10" maxlength="2000" placeholder="Mínimo 10 caracteres"></textarea>
        </label>
        <button class="btn btn-gold btn-block" type="submit">Enviar al buzón</button>
      </form>
    </main>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    ui.renderHeader('sugerencias');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      try {
        const data = await api.post('/api/sugerencias', {
          nombre: form.nombre.value,
          email: form.email.value,
          mensaje: form.mensaje.value,
        });
        form.reset();
        ui.toast(data.message || 'Gracias por tu sugerencia');
      } catch (err) {
        ui.showFieldErrors(form, err.fields);
        ui.toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
