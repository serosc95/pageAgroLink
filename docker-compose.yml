services:
  postgres:
    image: postgres:16-alpine
    container_name: addcom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: addcom
      POSTGRES_USER: addcom
      POSTGRES_PASSWORD: addcom_dev_password
    ports:
      - "5432:5432"
    volumes:
      - addcom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U addcom -d addcom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  addcom_pgdata:
